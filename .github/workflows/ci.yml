# Acuan: docs/PRD.md §§9.5–9.6, 11. Hanya pemeriksaan fondasi yang ada.
name: M0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: M0 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; SHA diverifikasi lewat GitHub API
        with:
          persist-credentials: false
      - name: Setup Node untuk validator M0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; SHA diverifikasi lewat GitHub API
        with:
          node-version: '24'
      - name: Install dependency validator dari lockfile
        run: npm ci --prefix .github/validation --ignore-scripts --no-audit --no-fund
      - name: Validasi dokumen, YAML, dan pengaman workflow
        run: node .github/validation/validate.mjs
